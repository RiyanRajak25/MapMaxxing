services:
  - type: web
    name: urban-change-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEE_PROJECT_ID
        sync: false
      - key: GEE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GEE_SERVICE_ACCOUNT_KEY
        value: /etc/secrets/gee-service-account.json
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_AOI_KM2
        value: "3000"

  - type: static
    name: urban-change-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
